[workspace]
resolver = "2"
members = [
    "crates/constitution-archive",
    "crates/constitution-wasm",
    "crates/constitution-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
unicode-normalization = "0.1"

constitution-archive = { path = "crates/constitution-archive" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
