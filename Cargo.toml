[workspace]
resolver = "2"
members = [
    "crates/constitution-archive",
    "crates/constitution-wasm",
    "crates/constitution-cli",
    "crates/constitution-server",
    "crates/constitution-pipeline",
    "crates/constitution-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.78"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
unicode-normalization = "0.1"
dioxus = "0.7.0"

# Server-only deps (used by constitution-server).
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "net"] }
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
http-body-util = "0.1"

constitution-archive = { path = "crates/constitution-archive" }
constitution-pipeline = { path = "crates/constitution-pipeline" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
