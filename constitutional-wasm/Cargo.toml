[package]
name = "constitutional-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"
unicode-normalization = "0.1"
lazy_static = "1.4"


[profile.release]
opt-level = "z"
lto = true
strip = true
