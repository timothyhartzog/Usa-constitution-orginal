services:
  - type: web
    name: constitutional-analytics-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/analytics_engine.py
    startCommand: gunicorn analytics.api:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
    healthCheckPath: /api/health
    autoDeploy: true

staticSite:
  name: constitutional-research-frontend
  buildCommand: echo "Static site - no build needed"
  staticPublishPath: ./
  envVars: []
  autoDeploy: true
