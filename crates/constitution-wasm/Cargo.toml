[package]
name = "constitution-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebAssembly bindings for the constitution-archive search engine."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
constitution-archive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# `wasm-bindgen` is only pulled in for wasm32 targets so the workspace builds
# cleanly with stock cargo on native (no wasm toolchain required).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
console_error_panic_hook = "0.1"
