[package]
name = "constitution-archive"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pure-Rust searchable archive of U.S. Constitution corpus (works on native + wasm32)."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
thiserror = { workspace = true }
unicode-normalization = { workspace = true }

# ML Dependencies (Phase 1, 2, 3)
candle-core = { version = "0.8.2", optional = true }
candle-nn = { version = "0.8.2", optional = true }
candle-transformers = { version = "0.8.2", optional = true }
tokenizers = { version = "0.19.1", optional = true }
hf-hub = { version = "0.3.2", optional = true }
tokio = { workspace = true, optional = true }
reqwest = { version = "0.13.4", features = ["stream"], optional = true }
futures-util = { workspace = true, optional = true }

[features]
default = []
# Enable JSON ingestion of the legacy Python-pipeline corpus.
ingest-json = []
# Enable local native ML (Reranking, Vectors, RAG)
ml = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub", "dep:tokio", "dep:reqwest", "reqwest?/json", "reqwest?/stream", "dep:futures-util"]
mlx = ["dep:mlx-rs"]
reqwest = ["dep:reqwest"]
futures-util = ["dep:futures-util"]

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = { version = "0.25.3", optional = true }
