name: ingest

# Manually-triggered ingest workflow that runs the full pipeline on a
# permissive runner — egress to founders.archives.gov, gutenberg.org,
# archive.org, oll.libertyfund.org, avalon.law.yale.edu, etc. is open
# from GitHub-hosted runners. Commits the resulting raw / clean / chunk
# / index artifacts back to the same branch.
#
# Trigger from the Actions tab → "ingest" → "Run workflow", or via:
#   gh workflow run ingest.yml --ref claude/constitution-archive-wasm-F1cRt

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force re-download of every source even when cached"
        type: boolean
        default: false
      commit_back:
        description: "Commit the new raw/clean/chunk/archive files back to the branch"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ingest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the full token so we can push back to the branch.
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-ingest-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-ingest-
            cargo-${{ runner.os }}-

      - name: Install wasm-bindgen-cli
        run: cargo install --locked --version 0.2.121 wasm-bindgen-cli

      - name: Pre-flight URL probe
        # Doesn't fail the build — just records which manifest URLs respond
        # before we commit to a long sequential download.
        run: |
          python3 - <<'PY'
          import json, sys, urllib.request, urllib.error, ssl
          ctx = ssl.create_default_context()
          manifest = json.load(open('config/sources_manifest.json'))
          rows = []
          for collection in manifest['collections']:
              for doc in collection['documents']:
                  url = doc['source_url']
                  try:
                      req = urllib.request.Request(url, method='HEAD', headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=15, context=ctx) as r:
                          rows.append((doc['document_id'], r.status, url))
                  except urllib.error.HTTPError as e:
                      rows.append((doc['document_id'], e.code, url))
                  except Exception as e:
                      rows.append((doc['document_id'], f'ERR {e!r}', url))
          ok = sum(1 for r in rows if isinstance(r[1], int) and 200 <= r[1] < 400)
          print(f'\n{ok}/{len(rows)} HEAD responses 2xx/3xx')
          for did, code, url in rows:
              print(f'  {str(code):>3}  {did:<48}  {url}')
          PY

      - name: Ingest sources
        env:
          GITHUB_STEP_SUMMARY: ${{ github.workspace }}/.ingest-summary.md
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
              python3 scripts/ingest_sources.py --force
          else
              python3 scripts/ingest_sources.py
          fi
          # Surface the report regardless.
          if [ -f .ingest-summary.md ]; then
              cat .ingest-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Clean text
        run: python3 scripts/clean_text.py

      - name: Chunk documents
        run: python3 scripts/chunk_documents.py

      - name: Build static search index
        run: python3 scripts/build_search_index.py

      - name: Pytest sanity
        run: python3 -m pytest -q

      - name: Build binary archive
        run: cargo run --release --bin constitution-archive -- build

      - name: Build WASM bundle
        run: |
          cargo build --release --target wasm32-unknown-unknown -p constitution-wasm
          mkdir -p frontend/wasm/pkg
          wasm-bindgen \
              --target web \
              --out-dir frontend/wasm/pkg \
              --out-name constitution_wasm \
              target/wasm32-unknown-unknown/release/constitution_wasm.wasm

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Headless WASM smoke test
        run: node scripts/wasm_smoke_test.mjs

      - name: Coverage report (after ingest)
        run: |
          {
            echo ""
            echo "## Per-delegate coverage"
            echo ""
            echo '```'
            python3 scripts/delegate_coverage_report.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage results
        if: ${{ inputs.commit_back }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/clean data/chunks data/index data/acquisition_report.json data/clean_report.json
          # archive bin and wasm pkg are .gitignored — exclude on purpose.

      - name: Detect changes
        if: ${{ inputs.commit_back }}
        id: diff
        run: |
          if git diff --cached --quiet; then
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "No staged changes after ingest."
          else
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              git diff --cached --stat
          fi

      - name: Commit and push
        if: ${{ inputs.commit_back && steps.diff.outputs.has_changes == 'true' }}
        env:
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          FORCE_FLAG: ${{ inputs.force }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          downloaded=$(python3 -c 'import json; d=json.load(open("data/acquisition_report.json")); print(sum(1 for x in d["documents"] if x["status"]=="downloaded"))')
          failed=$(python3 -c 'import json; d=json.load(open("data/acquisition_report.json")); print(sum(1 for x in d["documents"] if x["status"]=="failed"))')
          msg_file=$(mktemp)
          {
            echo "Ingest: refresh corpus from primary sources"
            echo
            echo "Workflow: ${WORKFLOW_NAME} - run ${RUN_ID}"
            echo "Force: ${FORCE_FLAG}"
            echo "Newly downloaded: ${downloaded} - Failed: ${failed}"
            echo
            echo "This commit was produced by .github/workflows/ingest.yml on a"
            echo "network-permissive runner. Rebuild the binary archive locally with"
            echo "    cargo run --release --bin constitution-archive -- build"
          } > "$msg_file"
          git commit -F "$msg_file"
          git push origin "HEAD:${REF_NAME}"
