name: build-and-test

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "data/process_timeline.json"
      - "data/chunks/constitution_full_corpus.json"
      - "scripts/build_wasm.sh"
      - "scripts/wasm_smoke_test.mjs"
      - "frontend/wasm/**"
      - ".github/workflows/wasm-build.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "data/process_timeline.json"
      - "data/chunks/constitution_full_corpus.json"
      - "scripts/build_wasm.sh"
      - "scripts/wasm_smoke_test.mjs"
      - "frontend/wasm/**"
      - ".github/workflows/wasm-build.yml"

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (with wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install wasm-bindgen-cli
        run: cargo install --locked --version 0.2.121 wasm-bindgen-cli

      - name: Cargo workspace tests
        run: cargo test --workspace

      - name: Cargo workspace clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build binary archive + WASM bundle
        run: bash scripts/build_wasm.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Headless WASM smoke test
        run: node scripts/wasm_smoke_test.mjs

      - name: WASM bundle size check
        run: |
          wasm_bytes=$(stat -c%s frontend/wasm/pkg/constitution_wasm_bg.wasm)
          archive_bytes=$(stat -c%s data/index/constitution_archive.bin)
          echo "WASM bundle: $wasm_bytes bytes"
          echo "Binary archive: $archive_bytes bytes"
          # WASM bundle target is < 1 MB; current build is ~380 KB.
          if [ "$wasm_bytes" -gt 1048576 ]; then
            echo "ERROR: WASM bundle exceeded 1 MB ceiling"
            exit 1
          fi

      - name: HTTP smoke test against constitution-server
        run: |
          target/release/constitution-server \
              --addr 127.0.0.1:8765 \
              --static-dir frontend &
          SERVER_PID=$!
          # Wait for the bind to settle.
          for i in 1 2 3 4 5; do
            if curl -sf http://127.0.0.1:8765/healthz >/dev/null; then break; fi
            sleep 1
          done

          set -e
          curl -sf http://127.0.0.1:8765/healthz | python3 -c \
            "import json,sys; d=json.load(sys.stdin); assert d['status']=='ok'; assert d['chunks']>1000"
          curl -sf http://127.0.0.1:8765/api/stats | python3 -c \
            "import json,sys; d=json.load(sys.stdin); assert d['citations']>1000; assert d['events']>=35"
          curl -sf -X POST -H 'content-type: application/json' \
              -d '{"query":"great compromise","limit":3,"fuzzy_distance":2}' \
              http://127.0.0.1:8765/api/search | python3 -c \
            "import json,sys; d=json.load(sys.stdin); assert d['total']>=1, d"
          curl -sf 'http://127.0.0.1:8765/api/citations/top?limit=5' | python3 -c \
            "import json,sys; d=json.load(sys.stdin); assert len(d)==5"
          curl -sf 'http://127.0.0.1:8765/api/citations/graph?top=10' | python3 -c \
            "import json,sys; d=json.load(sys.stdin); assert len(d['nodes'])==10; assert len(d['edges'])>=1"
          curl -sf 'http://127.0.0.1:8765/api/process/phase/convention' | python3 -c \
            "import json,sys; d=json.load(sys.stdin); assert len(d)>=5"

          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
